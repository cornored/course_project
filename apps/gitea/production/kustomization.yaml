apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../base
  - hpa.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/values/ingress/hosts/0/host
        value: gitea.local
      - op: add
        path: /spec/values/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
    target:
      kind: HelmRelease
      name: gitea
  - patch: |-
      - op: replace
        path: /spec/instances
        value: 3
      - op: replace
        path: /spec/storage/size
        value: 5Gi
    target:
      kind: Cluster
      name: gitea-db