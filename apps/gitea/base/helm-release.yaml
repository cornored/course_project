apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
spec:
  interval: 10m
  chart:
    spec:
      chart: gitea
      version: "10.*"
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: flux-system
  values:
    # Disable bundled PostgreSQL — using CNPG
    postgresql-ha:
      enabled: false
    postgresql:
      enabled: false
    redis-cluster:
      enabled: false

    gitea:
      config:
        database:
          DB_TYPE: postgres
          HOST: gitea-db-rw:5432
          NAME: gitea
          USER: gitea
          PASSWD: gitea-password
        cache:
          ADAPTER: memory
        session:
          PROVIDER: memory
        queue:
          TYPE: level

    persistence:
      enabled: true
      size: 1Gi

    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: gitea.staging.local
          paths:
            - path: /
              pathType: Prefix