apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: gitea-db
  namespace: staging

spec:
  instances: 1

  storage:
    size: 1Gi

  superuserSecret:
    name: gitea-db-superuser

  bootstrap:
    initdb:
      database: gitea
      owner: gitea

      secret:
        name: gitea-db-user