apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: n8n
  namespace: staging

spec:
  interval: 10m

  chart:
    spec:
      chart: n8n
      version: "*"

      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: flux-system

  values:
    main:
      config:
        db:
          type: postgresdb

        database:
          postgresdb:
            host: n8n-db-rw.staging.svc.cluster.local
            port: 5432
            database: n8n
            user: n8n
            password: n8n-password

    ingress:
      enabled: true
      className: traefik

      hosts:
        - host: n8n.staging.local
          paths:
            - path: /
              pathType: Prefix

    persistence:
      enabled: true
      size: 1Gi